; Copy to settings.ini and adjust for your device.
; All values below are safe defaults; see README for details.

[sensors]
unit = C
; MICS-6814 heater warmup time in seconds.
; A longer warmup (e.g. 120-300) gives a more stable clean-air baseline.
warmup_seconds = 10
; Sensor read interval in seconds
read_interval = 2

; Calibration offsets — add these values to raw readings.
; Tune these by comparing against a known-accurate reference sensor.
; Example: if your BME280 reads 2°C too high, set temp_offset = -2.0
temp_offset = 0.0
humidity_offset = 0.0
pressure_offset = 0.0
; Light sensor offset (additive, in lux)
light_offset = 0.0

; Temperature compensation mode: "polynomial" (cubic curve compensating
; Pi CPU heat, from roscoe81/enviro-monitor) or "offset" (raw + temp_offset).
temp_comp_mode = offset
; Humidity compensation mode: "quadratic" or "offset".
; WARNING: the quadratic coefficients are unit-specific (fit to a sensor
; reading ~20-30% low) and likely wrong for your unit — keep "offset".
hum_comp_mode = offset

; Altitude above sea level in meters. Used to convert raw barometric
; pressure to sea-level (QNH) so it matches local weather reports.
altitude = 0.0

; Gas sensor clean-air calibration:
;   gas_calibration_hour — hour (0-23) for daily 7-day rolling R0 drift
;                          compensation. Default 3 (3am).
;   reset_gas_calibration — set true once to clear the stored baseline;
;                           the next warm read re-baselines in current air.
gas_calibration_hour = 3
reset_gas_calibration = false

[logging]
; How often to record to SQLite (seconds)
record_interval = 60
; SQLite database path (relative to project root)
db_path = enviro_data.db

[sync]
; Enable/disable NAS sync
enabled = false
; SSH user@host for the NAS
remote = user@nas-ip:/path/to/backup/
; Sync interval in seconds
interval = 300
; Max retries on failure before giving up for this cycle
max_retries = 3

[web]
; Flask host and port
host = 0.0.0.0
port = 5000
; Page auto-refresh interval in seconds
refresh_interval = 5
